[workspace]
resolver = "2"
members = [
    "crates/engine-core",
    "crates/engine-render",
    "crates/engine-platform",
    "crates/engine-py",
]

[workspace.package]
version = "0.6.13"
edition = "2024"
license = "MIT"
authors = ["Phil Hodgins <philip.a.hodgins@gmail.com>"]
repository = "https://github.com/mindderivative/tess-re"
homepage = "https://github.com/mindderivative/tess-re"
# The MSRV, derived rather than claimed (LESSONS_LEARNED.md §5: TRE v1's
# `1.75` was quietly false). 0.4.0: the highest `rust-version` any locked
# dependency declares is `ordered-float` 5.5.0's 1.90 (`vello_gpu` and
# friends at the pinned commit declare 1.89), and `cargo +1.90 check
# --workspace --all-targets` passes. CI's `msrv` job enforces it; raise
# both together when a dependency bump raises the floor.
rust-version = "1.90"

# The renderer, from crates.io at exact versions (`=`): `vello_gpu` (the
# no-clear and rect-clear render modes partial redraw needs are stable API
# since 0.4.0), `vello_common` and `glifo`. The three move together: mixing
# versions would give two incompatible sets of types. `wgpu` must be the major
# version `vello_gpu` uses (30): the `wgpu::Device` made here is passed into
# `vello_gpu`. The versions are exact so a bump is deliberate: bump all
# three together and re-run the pixel tests.
[workspace.dependencies]
vello_gpu = { version = "=0.4.0", default-features = false, features = ["wgpu", "wgpu_default", "text"] }
vello_common = { version = "=0.4.0", default-features = false, features = ["std"] }
# `png` lets glifo decode a bitmap glyph (CBDT, `sbix`). Such a glyph only
# draws through glifo's atlas: the uncached path hands `vello_gpu` a pixmap,
# which it panics on. `text.rs` therefore always atlases a bitmap run.
glifo = { version = "=0.5.0", features = ["png"] }
# Reads a font's bitmap strikes (see `text.rs`). The version glifo already uses,
# so the lock keeps one copy.
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
wgpu = "30.0.1"
# 0.5.1 (#66): parses and validates a shader's WGSL on the CPU, with no GPU.
# Already in the lock at this version through `wgpu` and `vello_gpu_shaders`;
# a direct dependency adds no new crate.
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in"] }

# Debug builds grew `target/debug` to 462 GB (full debug info in every test
# and example binary, plus the incremental cache). Line tables keep file and
# line numbers in backtraces and panics without the full variable-level
# info, and no incremental cache means a full recompile of each changed
# crate instead of a cache that grows without bound.
[profile.dev]
debug = "line-tables-only"
incremental = false
